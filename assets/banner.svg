<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" fill="none">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="55%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="360" rx="24" fill="url(#heroBg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#glow1)"/>
  <rect width="1200" height="360" rx="24" fill="url(#glow2)"/>
  <rect x="2" y="2" width="1196" height="356" rx="22" stroke="url(#accentGrad)" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Decorative Grid Dots -->
  <g fill="#FFFFFF" opacity="0.06">
    <circle cx="960" cy="60" r="3"/><circle cx="990" cy="60" r="3"/><circle cx="1020" cy="60" r="3"/><circle cx="1050" cy="60" r="3"/><circle cx="1080" cy="60" r="3"/><circle cx="1110" cy="60" r="3"/>
    <circle cx="960" cy="90" r="3"/><circle cx="990" cy="90" r="3"/><circle cx="1020" cy="90" r="3"/><circle cx="1050" cy="90" r="3"/><circle cx="1080" cy="90" r="3"/><circle cx="1110" cy="90" r="3"/>
    <circle cx="960" cy="120" r="3"/><circle cx="990" cy="120" r="3"/><circle cx="1020" cy="120" r="3"/><circle cx="1050" cy="120" r="3"/><circle cx="1080" cy="120" r="3"/><circle cx="1110" cy="120" r="3"/>
  </g>

  <!-- Left Logo Emblem -->
  <g transform="translate(88, 76)">
    <rect x="0" y="0" width="208" height="208" rx="52" fill="url(#logoGrad)"/>
    <rect x="5" y="5" width="198" height="198" rx="47" stroke="white" stroke-opacity="0.25" stroke-width="2"/>
    <path d="M46 94 L40 46 C39 40 45 36 50 40 L82 63 C89 60 96 59 104 59 C112 59 119 60 126 63 L158 40 C163 36 169 40 168 46 L162 94 C169 104 172 116 172 128 C172 158 144 178 104 178 C64 178 36 158 36 128 C36 116 39 104 46 94 Z" fill="#FFFFFF"/>
    <path d="M51 82 L49 54 L73 71 Z" fill="#F472B6" opacity="0.8"/>
    <path d="M157 82 L159 54 L135 71 Z" fill="#F472B6" opacity="0.8"/>
    <text x="104" y="138" text-anchor="middle" font-family="'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-weight="900" font-size="70" fill="url(#logoGrad)">譯</text>
  </g>

  <!-- Right Typography -->
  <g transform="translate(348, 108)">
    <text x="0" y="34" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-weight="800" font-size="68" fill="#FFFFFF" letter-spacing="-1.5">Trans<tspan fill="url(#accentGrad)">Mao</tspan></text>
    <rect x="356" y="-8" width="112" height="34" rx="17" fill="#4F46E5" fill-opacity="0.35" stroke="#818CF8" stroke-width="1.5"/>
    <text x="412" y="14" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="14" fill="#E0E7FF">v0.1.0 · zh-TW</text>

    <text x="2" y="84" font-family="'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-weight="500" font-size="24" fill="#CBD5E1">專為繁體中文打造的抗失效網頁翻譯 × 反白沉浸式查詞擴充套件</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 118)">
      <rect x="0" y="0" width="152" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <text x="76" y="24" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">🌐 全頁雙語翻譯</text>

      <rect x="166" y="0" width="166" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <text x="249" y="24" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">✨ 反白詞性與例句</text>

      <rect x="346" y="0" width="144" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <text x="418" y="24" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">🔊 真人語音發音</text>

      <rect x="504" y="0" width="194" height="38" rx="19" fill="#EC4899" fill-opacity="0.18" stroke="#F472B6" stroke-opacity="0.45"/>
      <text x="601" y="24" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="600" fill="#FCE7F3">🤗 HF 本地超小模型支援</text>
    </g>

    <text x="2" y="196" font-family="'Segoe UI', monospace" font-size="14" fill="#94A3B8">Open Source · Apache-2.0 License · Crafted by SxiMao (@SixMao0122)</text>
  </g>
