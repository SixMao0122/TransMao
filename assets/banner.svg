<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" fill="none">
  <!-- Warm Paper Sketchbook Canvas -->
  <rect x="8" y="8" width="1188" height="328" rx="22" fill="#26231F"/>
  <rect x="2" y="2" width="1188" height="328" rx="22" fill="#FBF9F5" stroke="#26231F" stroke-width="3"/>

  <!-- Subtle Notebook Dot Grid -->
  <g fill="#D5CDC0" opacity="0.65">
    <circle cx="960" cy="54" r="2.5"/><circle cx="990" cy="54" r="2.5"/><circle cx="1020" cy="54" r="2.5"/><circle cx="1050" cy="54" r="2.5"/><circle cx="1080" cy="54" r="2.5"/><circle cx="1110" cy="54" r="2.5"/>
    <circle cx="960" cy="84" r="2.5"/><circle cx="990" cy="84" r="2.5"/><circle cx="1020" cy="84" r="2.5"/><circle cx="1050" cy="84" r="2.5"/><circle cx="1080" cy="84" r="2.5"/><circle cx="1110" cy="84" r="2.5"/>
    <circle cx="960" cy="114" r="2.5"/><circle cx="990" cy="114" r="2.5"/><circle cx="1020" cy="114" r="2.5"/><circle cx="1050" cy="114" r="2.5"/><circle cx="1080" cy="114" r="2.5"/><circle cx="1110" cy="114" r="2.5"/>
  </g>

  <!-- Left Hand-Drawn Cat Stamp -->
  <g transform="translate(82, 62)">
    <rect x="8" y="8" width="196" height="196" rx="40" fill="#26231F"/>
    <rect x="0" y="0" width="196" height="196" rx="40" fill="#FFFFFF" stroke="#26231F" stroke-width="4.5"/>
    <path d="M40 94 L37 46 C37 40 44 37 49 41 L78 63 C85 60 91 59 98 59 C105 59 111 60 118 63 L147 41 C152 37 159 40 159 46 L156 94 C162 103 165 114 165 125 C165 153 137 170 98 170 C59 170 31 153 31 125 C31 114 34 103 40 94 Z" fill="#C85A32" stroke="#26231F" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M48 79 L47 54 L68 69 Z" fill="#F0DFC8"/>
    <path d="M148 79 L149 54 L128 69 Z" fill="#F0DFC8"/>
    <circle cx="74" cy="116" r="7" fill="#26231F"/>
    <circle cx="122" cy="116" r="7" fill="#26231F"/>
    <path d="M93 126 L103 126 L98 133 Z" fill="#FBF9F5"/>
    <path d="M87 139 Q98 146 109 139" stroke="#FBF9F5" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Right Typography -->
  <g transform="translate(334, 92)">
    <text x="0" y="34" font-family="'Noto Sans TC', 'Segoe UI', sans-serif" font-weight="900" font-size="62" fill="#1F1D1A" letter-spacing="-1">Trans<tspan fill="#C85A32">Mao</tspan></text>
    <rect x="336" y="-8" width="110" height="32" rx="8" fill="#F3ECE0" stroke="#26231F" stroke-width="1.5"/>
    <text x="391" y="13" text-anchor="middle" font-family="ui-monospace, monospace" font-weight="700" font-size="13" fill="#1F1D1A">v0.1.0 · zh-TW</text>

    <text x="2" y="84" font-family="'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-weight="600" font-size="22" fill="#57524A">專為繁體中文打造的抗失效網頁翻譯與反白查詞套件</text>

    <!-- Stationery Tags (Zero Emojis) -->
    <g transform="translate(0, 114)">
      <rect x="0" y="0" width="142" height="36" rx="8" fill="#FFFFFF" stroke="#26231F" stroke-width="1.5"/>
      <text x="71" y="23" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="13.5" font-weight="700" fill="#1F1D1A">全頁雙語底色對照</text>

      <rect x="156" y="0" width="146" height="36" rx="8" fill="#FFFFFF" stroke="#26231F" stroke-width="1.5"/>
      <text x="229" y="23" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="13.5" font-weight="700" fill="#1F1D1A">反白詞性與例句</text>

      <rect x="316" y="0" width="136" height="36" rx="8" fill="#FFFFFF" stroke="#26231F" stroke-width="1.5"/>
      <text x="384" y="23" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="13.5" font-weight="700" fill="#1F1D1A">美英雙音發音</text>

      <rect x="466" y="0" width="182" height="36" rx="8" fill="#C85A32" stroke="#26231F" stroke-width="1.5"/>
      <text x="557" y="23" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="13.5" font-weight="700" fill="#FBF9F5">HF 本地離線超小模型</text>
    </g>

    <text x="2" y="192" font-family="'Noto Sans TC', sans-serif" font-size="13.5" fill="#787166">Apache-2.0 Open Source · 作者: SxiMao (@SixMao0122)</text>
  </g>
</svg>
