<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="1200" height="548" fill="none">
  <!-- Simulated Clean Webpage -->
  <rect width="920" height="420" rx="16" fill="#FFFFFF" stroke="#26231F" stroke-width="2"/>
  <rect width="920" height="42" rx="16" fill="#F3ECE0"/>
  <rect y="26" width="920" height="16" fill="#F3ECE0"/>
  <line x1="0" y1="42" x2="920" y2="42" stroke="#D8D1C5" stroke-width="1.5"/>
  <circle cx="24" cy="21" r="5.5" fill="#C85A32"/>
  <circle cx="42" cy="21" r="5.5" fill="#D4A359"/>
  <circle cx="60" cy="21" r="5.5" fill="#2E6F5E"/>
  <rect x="96" y="10" width="360" height="22" rx="6" fill="#FFFFFF" stroke="#D8D1C5"/>
  <text x="112" y="25" font-family="ui-monospace, monospace" font-size="11.5" fill="#6B655B">https://docs.example.org/engineering</text>

  <!-- Webpage English + Warm Tinted Bilingual Block -->
  <text x="44" y="96" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="20" fill="#1F1D1A">Discovering</text>
  <rect x="160" y="73" width="122" height="30" rx="5" fill="#F9E2D2" stroke="#C85A32"/>
  <text x="168" y="96" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="20" fill="#9A3B1A">serendipity</text>
  <text x="292" y="96" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="20" fill="#1F1D1A">in web tools</text>

  <!-- Warm Bilingual Highlight Block -->
  <rect x="44" y="112" width="346" height="36" rx="6" fill="#D6B280" fill-opacity="0.2"/>
  <rect x="44" y="112" width="3.5" height="36" fill="#C85A32"/>
  <text x="58" y="135" font-family="'Noto Sans TC', sans-serif" font-size="14.5" fill="#3A3630">在網頁工具中發現意外的驚喜收穫</text>

  <text x="44" y="182" font-family="'Segoe UI', sans-serif" font-size="14" fill="#57524A">Resilient workflows never break when APIs fail.</text>
  <rect x="44" y="194" width="346" height="34" rx="6" fill="#D6B280" fill-opacity="0.2"/>
  <rect x="44" y="194" width="3.5" height="34" fill="#C85A32"/>
  <text x="58" y="216" font-family="'Noto Sans TC', sans-serif" font-size="13.5" fill="#3A3630">具備韌性的流程在 API 失效時絕不中斷。</text>

  <!-- Floating Seal Stamp Button -->
  <rect x="292" y="50" width="28" height="28" rx="7" fill="#26231F"/>
  <rect x="290" y="48" width="28" height="28" rx="7" fill="#C85A32" stroke="#26231F" stroke-width="1.5"/>
  <text x="304" y="67" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="800" font-size="13" fill="#FBF9F5">譯</text>

  <!-- Hand-Drawn Paper Dictionary Card -->
  <g transform="translate(428, 62)">
    <rect x="6" y="6" width="448" height="320" rx="14" fill="#26231F"/>
    <rect width="448" height="320" rx="14" fill="#FBF9F5" stroke="#26231F" stroke-width="2"/>

    <text x="22" y="38" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="22" fill="#1F1D1A">serendipity</text>
    <text x="22" y="59" font-family="ui-monospace, monospace" font-size="12.5" fill="#6B655B">/ˌser.ənˈdɪp.ə.ti/</text>
    <line x1="0" y1="72" x2="448" y2="72" stroke="#D8D1C5" stroke-dasharray="4 4"/>

    <!-- Audio Pills -->
    <rect x="22" y="84" width="84" height="26" rx="13" fill="#FFFFFF" stroke="#26231F" stroke-width="1.2"/>
    <text x="64" y="101" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="700" font-size="11.5" fill="#1F1D1A">美音 US</text>
    <rect x="114" y="84" width="84" height="26" rx="13" fill="#FFFFFF" stroke="#26231F" stroke-width="1.2"/>
    <text x="156" y="101" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="700" font-size="11.5" fill="#1F1D1A">英音 UK</text>

    <!-- Primary zh-TW Box -->
    <rect x="22" y="122" width="404" height="40" rx="8" fill="#F3ECE0" stroke="#DFD6C7"/>
    <rect x="22" y="122" width="3.5" height="40" fill="#C85A32"/>
    <text x="36" y="147" font-family="'Noto Sans TC', sans-serif" font-weight="700" font-size="16" fill="#1F1D1A">意外發現珍貴事物的運氣；機緣巧合</text>

    <!-- POS Pill -->
    <rect x="22" y="176" width="66" height="22" rx="5" fill="#3B5B8C" fill-opacity="0.14" stroke="#3B5B8C" stroke-opacity="0.4"/>
    <text x="55" y="191" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="700" font-size="11.5" fill="#3B5B8C">n. 名詞</text>

    <!-- Example Box -->
    <rect x="22" y="208" width="404" height="62" rx="8" fill="#FFFFFF" stroke="#E4DDD1"/>
    <text x="34" y="230" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#2C2925">“Finding this open-source tool was pure serendipity.”</text>
    <text x="34" y="253" font-family="'Noto Sans TC', sans-serif" font-size="12.5" fill="#6B655B">「找到這個開源工具純屬機緣巧合。」</text>

    <!-- Footer -->
    <rect y="282" width="448" height="38" rx="14" fill="#F5EFE6"/>
    <line x1="0" y1="282" x2="448" y2="282" stroke="#D8D1C5" stroke-dasharray="4 4"/>
    <text x="22" y="306" font-family="'Noto Sans TC', sans-serif" font-size="11.5" fill="#787166">TransMao · Google (zh-TW)</text>
    <rect x="362" y="291" width="64" height="22" rx="6" fill="#C85A32" stroke="#26231F" stroke-width="1"/>
    <text x="394" y="306" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="700" font-size="11" fill="#FBF9F5">已收藏</text>
  </g>
</svg>
