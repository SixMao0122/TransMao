<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="55%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="earGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Rounded Squircle Background -->
  <rect x="16" y="16" width="224" height="224" rx="56" fill="url(#bgGrad)"/>
  <!-- Subtle Inner Border -->
  <rect x="22" y="22" width="212" height="212" rx="50" stroke="white" stroke-opacity="0.2" stroke-width="2"/>
  <!-- Cat Head Silhouette with Ears -->
  <g filter="url(#softShadow)">
    <path d="M62 114 L54 58 C53 51 60 47 66 51 L102 78 C110 75 119 74 128 74 C137 74 146 75 154 78 L190 51 C196 47 203 51 202 58 L194 114 C202 126 206 140 206 154 C206 190 174 214 128 214 C82 214 50 190 50 154 C50 140 54 126 62 114 Z" fill="#FFFFFF"/>
    <!-- Inner Ears -->
    <path d="M66 100 L63 66 L91 86 Z" fill="url(#earGrad)" opacity="0.85"/>
    <path d="M190 100 L193 66 L165 86 Z" fill="url(#earGrad)" opacity="0.85"/>
  </g>
  <!-- Stylized "譯" / Translation Emblem inside Cat Face -->
  <text x="128" y="166" text-anchor="middle" font-family="'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-weight="900" font-size="82" fill="url(#bgGrad)">譯</text>
  <!-- Cute Whiskers -->
  <g stroke="#7C3AED" stroke-width="4" stroke-linecap="round" opacity="0.45">
    <line x1="34" y1="146" x2="58" y2="150"/>
    <line x1="36" y1="164" x2="58" y2="162"/>
    <line x1="222" y1="146" x2="198" y2="150"/>
    <line x1="220" y1="164" x2="198" y2="162"/>
  </g>
  <!-- Sparkle -->
  <path d="M206 42 L210 52 L220 56 L210 60 L206 70 L202 60 L192 56 L202 52 Z" fill="#FDE68A"/>
</svg>
