<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TransMao 譯貓 — 進階設定與已收藏單字清單</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #f6f2ea;
        background-image: radial-gradient(#dcd4c6 1px, transparent 1px);
        background-size: 20px 20px;
        color: #1f1d1a;
        font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', -apple-system, sans-serif;
        min-height: 100vh;
        padding: 36px 20px;
      }
      .container {
        max-width: 780px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }
      .hero {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 24px;
        border-radius: 16px;
        background: #fbf9f5;
        border: 1.5px solid #26231f;
        box-shadow: 4px 4px 0 #26231f;
      }
      .hero-left {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .hero-left img {
        width: 50px;
        height: 50px;
        border-radius: 12px;
        border: 1.5px solid #26231f;
      }
      .hero h1 {
        font-size: 21px;
        font-weight: 800;
        color: #1f1d1a;
      }
      .hero p {
        font-size: 13px;
        color: #6b655b;
        margin-top: 3px;
      }
      .card {
        background: #fbf9f5;
        border: 1.5px solid #26231f;
        border-radius: 16px;
        padding: 22px 24px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        box-shadow: 4px 4px 0 #dfd7c9;
      }
      .card h2 {
        font-size: 16px;
        font-weight: 800;
        color: #1f1d1a;
        padding-bottom: 10px;
        border-bottom: 1px dashed #d8d1c5;
      }
      .field {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        font-size: 13.5px;
      }
      .field-title {
        font-weight: 600;
        color: #1f1d1a;
      }
      .field-desc {
        font-size: 12px;
        color: #6b655b;
        margin-top: 3px;
        line-height: 1.5;
      }
      select,
      textarea {
        background: #ffffff;
        color: #1f1d1a;
        border: 1.5px solid #c9c0b1;
        border-radius: 9px;
        padding: 8px 12px;
        font-size: 13px;
        font-family: inherit;
        outline: none;
      }
      select:focus,
      textarea:focus {
        border-color: #26231f;
      }
      textarea {
        width: 100%;
        min-height: 82px;
        resize: vertical;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        padding: 8px 16px;
        border-radius: 9px;
        border: 1.5px solid #26231f;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.12s, box-shadow 0.12s, background 0.12s;
      }
      .btn:hover {
        transform: translate(-1px, -1px);
      }
      .btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
        transform: none;
      }
      .btn-primary {
        background: #c85a32;
        color: #fbf9f5;
        box-shadow: 2.5px 2.5px 0 #26231f;
      }
      .btn-primary:hover {
        background: #b24b26;
        box-shadow: 3.5px 3.5px 0 #26231f;
      }
      .btn-secondary {
        background: #ffffff;
        color: #1f1d1a;
        box-shadow: 2px 2px 0 #d5cdc0;
      }
      .btn-secondary:hover {
        background: #f3ece0;
      }
      .icon-btn {
        padding: 6px 9px;
      }
      .progress-wrap {
        width: 100%;
        height: 9px;
        background: #ede6da;
        border-radius: 999px;
        overflow: hidden;
        border: 1px solid #c9c0b1;
      }
      .progress-bar {
        height: 100%;
        width: 0%;
        background: #c85a32;
        transition: width 0.25s ease;
      }
      .vocab-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 10px;
        border-bottom: 1px dashed #d8d1c5;
      }
      .vocab-header h2 {
        border-bottom: none;
        padding-bottom: 0;
      }
      .vocab-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .vocab-item {
        background: #ffffff;
        border: 1px solid #d8d1c5;
        border-left: 3.5px solid #c85a32;
        border-radius: 10px;
        padding: 12px 14px;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }
      .vocab-word {
        font-size: 16px;
        font-weight: 800;
        color: #1f1d1a;
      }
      .vocab-phonetic {
        font-size: 12px;
        color: #787166;
        font-weight: 400;
        font-family: ui-monospace, monospace;
        margin-left: 6px;
      }
      .vocab-zh {
        font-size: 14px;
        color: #9a3b1a;
        font-weight: 600;
        margin-top: 3px;
      }
      .vocab-ex {
        font-size: 12px;
        color: #6b655b;
        margin-top: 6px;
        line-height: 1.5;
      }
      .toast {
        font-size: 13px;
        font-weight: 700;
        color: #2e6f5e;
        min-height: 18px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="hero">
        <div class="hero-left">
          <img src="icons/icon128.png" alt="TransMao" />
          <div>
            <h1>TransMao 譯貓 · 進階設定</h1>
            <p>作者: SxiMao</p>
          </div>
        </div>
        <span id="saveMsg" class="toast"></span>
      </div>

      <!-- Hugging Face 本地超小模型設定 -->
      <div class="card">
        <h2>Hugging Face 本地離線超小模型（抗失效備援）</h2>
        <div class="field">
          <div>
            <div class="field-title">本地翻譯模型選擇</div>
            <div class="field-desc">首次啟用將快取於瀏覽器本機，之後離線亦可直接翻譯並透過 OpenCC 轉為台灣繁體中文</div>
          </div>
          <select id="hfModel">
            <option value="Xenova/opus-mt-en-zh">Xenova/opus-mt-en-zh（超輕量 ~80MB）</option>
            <option value="Xenova/nllb-200-distilled-600M">Xenova/nllb-200-distilled-600M（原生繁中 ~350MB）</option>
          </select>
        </div>
        <div class="field">
          <div id="hfStatusText" class="field-desc">模型狀態：尚未預載（切換至本地模型時將自動載入）</div>
          <button id="preloadHfBtn" class="btn btn-primary">預先下載並載入模型</button>
        </div>
        <div class="progress-wrap">
          <div id="hfProgressBar" class="progress-bar"></div>
        </div>
      </div>

      <!-- 體驗與黑名單設定 -->
      <div class="card">
        <h2>使用體驗與排除網域</h2>
        <div class="field">
          <div>
            <div class="field-title">反白查詞時自動發音</div>
            <div class="field-desc">展開字典卡片後自動朗讀英文單字（美式發音）</div>
          </div>
          <input id="autoSpeak" type="checkbox" style="width: 18px; height: 18px; accent-color: #c85a32; cursor: pointer" />
        </div>
        <div>
          <div class="field-title" style="margin-bottom: 6px">不啟用反白查詞的網域清單（每行一個網域，例如 <code>localhost</code>）</div>
          <textarea id="blacklist" placeholder="localhost&#10;docs.google.com"></textarea>
        </div>
        <div style="display: flex; gap: 10px; justify-content: flex-end">
          <button id="clearCacheBtn" class="btn btn-secondary">清除翻譯快取</button>
          <button id="saveBtn" class="btn btn-primary">儲存設定</button>
        </div>
      </div>

      <!-- 已收藏單字清單 -->
      <div class="card">
        <div class="vocab-header">
          <h2>已收藏單字清單（<span id="vocabCount">0</span>）</h2>
          <button id="exportVocabBtn" class="btn btn-secondary">匯出 JSON</button>
        </div>
        <div id="vocabList" class="vocab-list"></div>
      </div>
    </div>

    <script type="module" src="./options.js"></script>
  </body>
</html>
