<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TransMao 譯貓</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        width: 332px;
        background: #0f172a;
        color: #f8fafc;
        font-family: 'Segoe UI', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        overflow: hidden;
      }
      .accent {
        height: 3.5px;
        background: linear-gradient(90deg, #4f46e5, #7c3aed, #ec4899);
      }
      .wrap {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand img {
        width: 34px;
        height: 34px;
        border-radius: 9px;
      }
      .brand-title {
        font-size: 16px;
        font-weight: 800;
        letter-spacing: -0.3px;
      }
      .brand-sub {
        font-size: 11px;
        color: #94a3b8;
      }
      .badge {
        font-size: 11px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 999px;
        background: rgba(99, 102, 241, 0.22);
        color: #a5b4fc;
        border: 1px solid rgba(129, 140, 248, 0.35);
      }
      .primary-btn {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: none;
        background: linear-gradient(135deg, #4f46e5, #7c3aed, #ec4899);
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
        transition: transform 0.14s ease, filter 0.14s ease;
      }
      .primary-btn:hover {
        filter: brightness(1.08);
        transform: translateY(-1px);
      }
      .primary-btn.active {
        background: linear-gradient(135deg, #059669, #10b981);
        box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
      }
      .primary-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .section {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        font-size: 13px;
      }
      .row label {
        color: #cbd5e1;
        font-weight: 600;
      }
      select {
        background: #0f172a;
        color: #f8fafc;
        border: 1px solid #475569;
        border-radius: 8px;
        padding: 5px 8px;
        font-size: 12px;
        outline: none;
      }
      select:focus {
        border-color: #818cf8;
      }
      input[type='checkbox'] {
        width: 16px;
        height: 16px;
        accent-color: #8b5cf6;
        cursor: pointer;
      }
      .status-line {
        font-size: 11.5px;
        color: #94a3b8;
        text-align: center;
        min-height: 16px;
      }
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-top: 4px;
        border-top: 1px solid #1e293b;
        font-size: 12px;
      }
      .link-btn {
        background: none;
        border: none;
        color: #818cf8;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .link-btn:hover {
        text-decoration: underline;
      }
      .author {
        color: #64748b;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div class="accent"></div>
    <div class="wrap">
      <div class="header">
        <div class="brand">
          <img src="icons/icon48.png" alt="TransMao" />
          <div>
            <div class="brand-title">TransMao 譯貓</div>
            <div class="brand-sub">EN → 繁體中文 (zh-TW)</div>
          </div>
        </div>
        <span class="badge">v0.1.0</span>
      </div>

      <button id="toggleBtn" class="primary-btn">🌐 翻譯整個網頁</button>
      <div id="statusLine" class="status-line">反白網頁英文單字即可顯示釋義、詞性與發音</div>

      <div class="section">
        <div class="row">
          <label for="displayMode">網頁顯示模式</label>
          <select id="displayMode">
            <option value="bilingual">雙語對照（推薦）</option>
            <option value="replace">純繁體中文替換</option>
          </select>
        </div>

        <div class="row">
          <label for="engineSelect">翻譯引擎策略</label>
          <select id="engineSelect">
            <option value="auto">智慧容錯（Google → 備援）</option>
            <option value="google">Google 優先</option>
            <option value="mymemory">MyMemory 備援引擎</option>
            <option value="hf-local">🤗 HF 本地離線超小模型</option>
          </select>
        </div>

        <div class="row">
          <label for="selectionToggle">啟用反白懸浮查詞</label>
          <input id="selectionToggle" type="checkbox" checked />
        </div>

        <div class="row">
          <label for="triggerSelect">反白觸發方式</label>
          <select id="triggerSelect">
            <option value="icon">先顯示「譯」小圖示</option>
            <option value="instant">反白直接展開字典卡片</option>
          </select>
        </div>
      </div>

      <div class="footer">
        <button id="openOptions" class="link-btn">⚙️ 進階設定 / 單字本 / HF 模型</button>
        <span class="author">by SxiMao</span>
      </div>
    </div>

    <script type="module" src="./popup.js"></script>
  </body>
</html>
