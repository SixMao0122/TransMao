<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TransMao 譯貓</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        width: 332px;
        background: #fbf9f5;
        color: #1f1d1a;
        font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', -apple-system, sans-serif;
        overflow: hidden;
      }
      .wrap {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 13px;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 11px;
        border-bottom: 1px dashed #d8d1c5;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand img {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        border: 1.5px solid #26231f;
      }
      .brand-title {
        font-size: 16px;
        font-weight: 800;
        letter-spacing: -0.2px;
        color: #1f1d1a;
      }
      .brand-sub {
        font-size: 11px;
        color: #6b655b;
      }
      .badge {
        font-size: 11px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 6px;
        background: #f3ece0;
        color: #57524a;
        border: 1px solid #d5cdc0;
      }
      .primary-btn {
        width: 100%;
        padding: 11px 14px;
        border-radius: 10px;
        border: 1.5px solid #26231f;
        background: #c85a32;
        color: #fbf9f5;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 3px 3px 0 #26231f;
        transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
      }
      .primary-btn:hover {
        background: #b24b26;
        transform: translate(-1px, -1px);
        box-shadow: 4px 4px 0 #26231f;
      }
      .primary-btn.active {
        background: #2e6f5e;
      }
      .primary-btn.active:hover {
        background: #255b4d;
      }
      .primary-btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
        transform: none;
      }
      .section {
        background: #ffffff;
        border: 1.5px solid #26231f;
        border-radius: 12px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        box-shadow: 2.5px 2.5px 0 #e5ddd0;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        font-size: 13px;
      }
      .row label {
        color: #3a3630;
        font-weight: 600;
      }
      select {
        background: #fbf9f5;
        color: #1f1d1a;
        border: 1px solid #c9c0b1;
        border-radius: 7px;
        padding: 5px 8px;
        font-size: 12px;
        font-family: inherit;
        outline: none;
      }
      select:focus {
        border-color: #26231f;
      }
      input[type='checkbox'] {
        width: 16px;
        height: 16px;
        accent-color: #c85a32;
        cursor: pointer;
      }
      .status-line {
        font-size: 11.5px;
        color: #6b655b;
        text-align: center;
        min-height: 16px;
      }
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-top: 8px;
        border-top: 1px dashed #d8d1c5;
        font-size: 12px;
      }
      .link-btn {
        background: none;
        border: none;
        color: #c85a32;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .link-btn:hover {
        text-decoration: underline;
      }
      .author {
        color: #787166;
        font-size: 11.5px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="header">
        <div class="brand">
          <img src="icons/icon48.png" alt="TransMao" />
          <div>
            <div class="brand-title">TransMao 譯貓</div>
            <div class="brand-sub">EN → 繁體中文 (zh-TW)</div>
          </div>
        </div>
        <span class="badge">v0.1.0</span>
      </div>

      <button id="toggleBtn" class="primary-btn">翻譯整個網頁</button>
      <div id="statusLine" class="status-line">反白網頁英文單字即可查看繁中釋義、詞性與發音</div>

      <div class="section">
        <div class="row">
          <label for="displayMode">網頁顯示模式</label>
          <select id="displayMode">
            <option value="bilingual">雙語對照（推薦）</option>
            <option value="replace">純繁體中文替換</option>
          </select>
        </div>

        <div class="row">
          <label for="engineSelect">翻譯引擎策略</label>
          <select id="engineSelect">
            <option value="auto">智慧容錯（Google 優先）</option>
            <option value="google">Google 翻譯</option>
            <option value="mymemory">MyMemory 備援引擎</option>
            <option value="hf-local">HF 本地離線超小模型</option>
          </select>
        </div>

        <div class="row">
          <label for="selectionToggle">啟用反白懸浮查詞</label>
          <input id="selectionToggle" type="checkbox" checked />
        </div>

        <div class="row">
          <label for="triggerSelect">反白觸發方式</label>
          <select id="triggerSelect">
            <option value="icon">先顯示「譯」印章圖示</option>
            <option value="instant">反白直接展開字典卡片</option>
          </select>
        </div>
      </div>

      <div class="footer">
        <button id="openOptions" class="link-btn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>進階設定與單字清單</span>
        </button>
        <span class="author">作者: SxiMao</span>
      </div>
    </div>

    <script type="module" src="./popup.js"></script>
  </body>
</html>
